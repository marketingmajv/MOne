<!-- MODAL EXECUTIVO DE DEMANDAS CONSOLIDADAS DO CICLO (JAM, GEYSA, FAUZER) -->
<!-- Regra Mandatória M-One: x-teleport="body" e classe modal-close-btn -->
<div x-data="consolidatedDemandsModal()" @open-consolidated-demands-modal.window="openModal($event.detail)">
  <template x-teleport="body">
    <div
      class="modal"
      :class="{ 'show': isOpen }"
      x-show="isOpen"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @keydown.escape.window="closeModal()"
      style="display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 16px;"
      :style="isOpen ? 'display: flex;' : 'display: none;'"
      @click.self="closeModal()"
    >
      <div
        class="modal-card eval-modal-card"
        style="background: #0f172a !important; color: #f8fafc !important; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 30px 70px -15px rgba(0,0,0,0.85); overflow: hidden; padding: 0;"
      >
        <!-- Modal Head (#0b111f) -->
        <div style="padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: #0b111f !important;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 1.6rem;">⚡</span>
            <div>
              <h3 style="margin: 0; font-size: 1.15rem; font-weight: 800; color: #ffffff !important;">Pauta Consolidada de Demandas da Semana</h3>
              <p style="margin: 2px 0 0 0; font-size: 0.78rem; color: #94a3b8 !important;" x-text="data.cycle_title || 'Ciclo Semanal'"></p>
            </div>
          </div>

          <button
            type="button"
            class="modal-close-btn"
            @click="closeModal()"
            title="Fechar (Esc)"
            style="width: 36px !important; height: 36px !important; min-width: 36px !important; border-radius: 10px !important; background: rgba(255, 255, 255, 0.08) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #f8fafc !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 0 !important; cursor: pointer !important;"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Seletor dos 3 Líderes (#0d1527) -->
        <div style="padding: 12px 24px; background: #0d1527 !important; border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; gap: 8px;">
            <button
              type="button"
              @click="activeLeader = 'jam'"
              style="padding: 6px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;"
              :style="activeLeader === 'jam' ? 'background: #fbbf24; color: #000; font-weight: 800;' : 'background: rgba(255,255,255,0.08); color: #94a3b8;'"
            >
              <span>👔</span>
              <span>Jam Penitenti</span>
              <span class="badge" style="background: rgba(0,0,0,0.25); font-size: 0.7rem; padding: 1px 6px; border-radius: 4px;" x-text="(data.jam || []).length"></span>
            </button>

            <button
              type="button"
              @click="activeLeader = 'geysa'"
              style="padding: 6px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;"
              :style="activeLeader === 'geysa' ? 'background: #34d399; color: #000; font-weight: 800;' : 'background: rgba(255,255,255,0.08); color: #94a3b8;'"
            >
              <span>💼</span>
              <span>Geysa</span>
              <span class="badge" style="background: rgba(0,0,0,0.25); font-size: 0.7rem; padding: 1px 6px; border-radius: 4px;" x-text="(data.geysa || []).length"></span>
            </button>

            <button
              type="button"
              @click="activeLeader = 'fauzer'"
              style="padding: 6px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;"
              :style="activeLeader === 'fauzer' ? 'background: #c084fc; color: #000; font-weight: 800;' : 'background: rgba(255,255,255,0.08); color: #94a3b8;'"
            >
              <span>⚡</span>
              <span>Fauzer</span>
              <span class="badge" style="background: rgba(0,0,0,0.25); font-size: 0.7rem; padding: 1px 6px; border-radius: 4px;" x-text="(data.fauzer || []).length"></span>
            </button>
          </div>

          <!-- Ações de Envio WhatsApp -->
          <div style="display: flex; gap: 8px;">
            <button
              type="button"
              @click="copyText()"
              style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; font-size: 0.76rem; font-weight: 700; padding: 5px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;"
            >
              <span x-text="copied ? '✅ Copiado!' : '📋 Copiar Pauta'"></span>
            </button>
            <button
              type="button"
              @click="openWhatsApp()"
              style="background: rgba(37, 211, 102, 0.18); border: 1px solid rgba(37, 211, 102, 0.4); color: #25d366; font-size: 0.76rem; font-weight: 700; padding: 5px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;"
            >
              <span>📱 Enviar no WhatsApp</span>
            </button>
          </div>
        </div>

        <!-- Corpo com a Lista de Itens e Visualização da Mensagem -->
        <div style="flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #0f172a !important;">
          <template x-if="loading">
            <div style="text-align: center; padding: 50px 20px; color: #94a3b8;">
              <div style="font-size: 1.8rem; margin-bottom: 10px; animation: spin 1s linear infinite;">⏳</div>
              <p style="margin: 0;">Consolidando demandas da equipe no ciclo...</p>
            </div>
          </template>

          <template x-if="!loading">
            <div style="display: flex; flex-direction: column; gap: 16px;">
              <!-- Seção 1: Status Geral dos Colaboradores (Edição Rápida da Liderança) -->
              <div style="background: #090e17; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 1.1rem;">🚦</span>
                    <div>
                      <strong style="font-size: 0.88rem; color: #ffffff;" x-text="'Status Geral da Equipe (' + activeLeader.toUpperCase() + ')'"></strong>
                      <span x-show="activeLeader === 'fauzer'" class="badge" style="background: rgba(168,85,247,0.15); color: #c084fc; font-size: 0.65rem; margin-left: 6px;">OPCIONAL / SUGESTIVO</span>
                      <p style="margin: 0; font-size: 0.74rem; color: #94a3b8;">Defina o badge e parecer de cada colaborador para incluir automaticamente no WhatsApp:</p>
                    </div>
                  </div>

                  <div style="display: flex; gap: 8px;">
                    <button
                      type="button"
                      @click="saveTeamStatus()"
                      :disabled="savingStatus"
                      style="background: #10b981; color: #000; font-size: 0.76rem; font-weight: 800; padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;"
                    >
                      <span x-text="savingStatus ? '⏳ Salvando...' : '💾 Salvar Status'"></span>
                    </button>
                  </div>
                </div>

                <!-- Lista de Colaboradores em Linhas Rápidas -->
                <div style="display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; padding-right: 4px;">
                  <template x-for="item in currentStatusList" :key="item.employee_key">
                    <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <strong style="font-size: 0.82rem; color: #f8fafc;" x-text="item.employee_name"></strong>
                          <span style="font-size: 0.7rem; color: #94a3b8;" x-text="'(' + item.role_title + ')'"></span>
                        </div>

                        <!-- Semáforo Rápido -->
                        <div style="display: flex; gap: 4px;">
                          <button
                            type="button"
                            @click="setStatus(item.employee_key, 'aligned')"
                            style="padding: 3px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.15s;"
                            :style="item.status === 'aligned' ? 'background: #00e599; color: #000; border-color: #00e599; font-weight: 800;' : 'background: rgba(0,0,0,0.3); color: #94a3b8; border-color: rgba(255,255,255,0.08);'"
                          >
                            🟢 Alinhado
                          </button>
                          <button
                            type="button"
                            @click="setStatus(item.employee_key, 'attention')"
                            style="padding: 3px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.15s;"
                            :style="item.status === 'attention' ? 'background: #fbbf24; color: #000; border-color: #fbbf24; font-weight: 800;' : 'background: rgba(0,0,0,0.3); color: #94a3b8; border-color: rgba(255,255,255,0.08);'"
                          >
                            🟡 Atenção
                          </button>
                          <button
                            type="button"
                            @click="setStatus(item.employee_key, 'critical')"
                            style="padding: 3px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.15s;"
                            :style="item.status === 'critical' ? 'background: #f87171; color: #000; border-color: #f87171; font-weight: 800;' : 'background: rgba(0,0,0,0.3); color: #94a3b8; border-color: rgba(255,255,255,0.08);'"
                          >
                            🔴 Crítico
                          </button>
                        </div>
                      </div>

                      <!-- Input de Diagnóstico -->
                      <input
                        type="text"
                        class="form-input"
                        x-model="item.diagnosis"
                        placeholder="Parecer/diagnóstico em 1 a 2 frases para o WhatsApp..."
                        style="width: 100%; font-size: 0.78rem; border-radius: 6px; background: #000 !important; color: #f8fafc !important; border: 1px solid rgba(255,255,255,0.12) !important; padding: 5px 8px; box-sizing: border-box;"
                      />
                    </div>
                  </template>
                </div>
              </div>

              <!-- Seção 2: Resumo e Visualização da Mensagem WhatsApp -->
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="font-size: 0.78rem; color: #94a3b8; display: flex; justify-content: space-between;">
                  <span>Mensagem consolidada formatada para WhatsApp:</span>
                  <span>Total de <strong style="color: #f8fafc;" x-text="(data[activeLeader] || []).length"></strong> demanda(s)</span>
                </div>

                <pre
                  x-text="currentMessage"
                  style="margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.8rem; line-height: 1.5; color: #e2e8f0; white-space: pre-wrap; background: #090e17; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); max-height: 280px; overflow-y: auto;"
                ></pre>
              </div>

            </div>
          </template>
        </div>

        <!-- Footer -->
        <div style="padding: 12px 24px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end; align-items: center; background: #0b111f !important;">
          <button
            type="button"
            class="btn"
            @click="closeModal()"
            style="font-size: 0.85rem; font-weight: 600; padding: 7px 18px; border-radius: 8px;"
          >
            Fechar
          </button>
        </div>

      </div>
    </div>
  </template>
</div>

<script>
function consolidatedDemandsModal() {
  return {
    isOpen: false,
    loading: false,
    savingStatus: false,
    copied: false,
    cycleId: null,
    activeLeader: 'jam',
    data: {
      jam: [], geysa: [], fauzer: [],
      status_jam: [], status_geysa: [], status_fauzer: [],
      whatsapp_jam: '', whatsapp_geysa: '', whatsapp_fauzer: ''
    },

    openModal(detail) {
      this.cycleId = detail && detail.cycleId ? detail.cycleId : window.__CYCLE_ID__;
      this.isOpen = true;
      this.copied = false;
      this.fetchConsolidated();
    },

    closeModal() {
      this.isOpen = false;
    },

    get currentMessage() {
      if (this.activeLeader === 'jam') return this.data.whatsapp_jam || '';
      if (this.activeLeader === 'geysa') return this.data.whatsapp_geysa || '';
      if (this.activeLeader === 'fauzer') return this.data.whatsapp_fauzer || '';
      return '';
    },

    get currentStatusList() {
      if (this.activeLeader === 'jam') return this.data.status_jam || [];
      if (this.activeLeader === 'geysa') return this.data.status_geysa || [];
      if (this.activeLeader === 'fauzer') return this.data.status_fauzer || [];
      return [];
    },

    setStatus(empKey, newStatus) {
      const list = this.currentStatusList;
      const it = list.find(x => x.employee_key === empKey);
      if (it) {
        it.status = newStatus;
        if (newStatus === 'aligned') { it.status_label = 'Alinhado'; it.badge_icon = '🟢'; it.color = '#00e599'; }
        else if (newStatus === 'attention') { it.status_label = 'Atenção'; it.badge_icon = '🟡'; it.color = '#fbbf24'; }
        else if (newStatus === 'critical') { it.status_label = 'Crítico'; it.badge_icon = '🔴'; it.color = '#f87171'; }
      }
    },

    async saveTeamStatus() {
      if (!this.cycleId) return;
      this.savingStatus = true;
      try {
        const evalsMap = {};
        this.currentStatusList.forEach(it => {
          evalsMap[it.employee_key] = {
            status: it.status || 'aligned',
            diagnosis: it.diagnosis || ''
          };
        });

        const csrfToken = document.querySelector('input[name="csrf_token"]')?.value || '';
        const resp = await fetch('/api/relatorio/salvar-lote-status-gestor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
          body: JSON.stringify({
            cycle_id: this.cycleId,
            manager_key: this.activeLeader,
            evaluations_map: evalsMap
          })
        });
        const res = await resp.json();
        if (res.success) {
          await this.fetchConsolidated();
        }
      } catch(e) {
        console.error('Erro ao salvar status em lote:', e);
      } finally {
        this.savingStatus = false;
      }
    },

    async fetchConsolidated() {
      if (!this.cycleId) return;
      this.loading = true;
      try {
        const resp = await fetch(`/api/relatorio/demandas-consolidadas/${this.cycleId}`);
        const res = await resp.json();
        if (res.success && res.data) {
          this.data = res.data;
        }
      } catch (e) {
        console.error('Erro ao buscar demandas consolidadas:', e);
      } finally {
        this.loading = false;
      }
    },

    copyText() {
      const msg = this.currentMessage;
      if (!msg) return;
      navigator.clipboard.writeText(msg).then(() => {
        this.copied = true;
        setTimeout(() => { this.copied = false; }, 2500);
      });
    },

    openWhatsApp() {
      const msg = this.currentMessage;
      if (!msg) return;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }
  };
}
</script>
