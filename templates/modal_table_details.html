<!-- MODAL DE AUDITORIA PERMANENTE & FAIXAS DA TRANSPORTADORA (templates/modal_table_details.html) -->
<div id="tableDetailsModal" class="modal" onclick="if(event.target === this) closeTableDetailsModal()" style="z-index: 9999; display: none;">
  
  <div class="modal-card" style="background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 18px; width: 100%; max-width: 820px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
    
    <!-- CABEÇALHO DO MODAL -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 42px; height: 42px; border-radius: 12px; background: rgba(56, 189, 248, 0.12); color: var(--brand-blue); border: 1px solid rgba(56, 189, 248, 0.25); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
          🚚
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <h3 id="tdModalCarrierName" style="margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--text);">Transportadora</h3>
            <span id="tdModalRatesBadge" class="badge" style="font-size: 0.72rem; font-weight: 700; background: rgba(56, 189, 248, 0.12); color: var(--brand-blue); border-color: rgba(56, 189, 248, 0.25);">0 faixas</span>
          </div>
          <p id="tdModalTableName" style="margin: 3px 0 0; font-size: 0.78rem; color: var(--muted);">-</p>
        </div>
      </div>
      
      <button type="button" onclick="closeTableDetailsModal()" style="background: var(--surface-subtle); border: 1px solid var(--border-subtle); color: var(--text-muted); width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; font-weight: bold; transition: all 0.15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'" title="Fechar (Esc)">✕</button>
    </div>

    <!-- CORPO COM SCROLL: RELATÓRIO DE AUDITORIA IA + TABELA DE FAIXAS -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- CARD 1: RELATÓRIO PERMANENTE DE IMPORTAÇÃO & DIAGNÓSTICO IA -->
      <div style="padding: 16px; border-radius: 14px; border: 1px solid rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-size: 0.82rem; font-weight: 700; color: #f59e0b; display: flex; align-items: center; gap: 6px;">
            <span>📋</span>
            <span>Relatório Permanente de Auditoria & Importação da IA</span>
          </span>
          <button type="button" onclick="copyTableReportNotes()" class="btn sm secondary" style="font-size: 0.72rem; padding: 4px 10px; height: auto;" title="Copiar diagnóstico para enviar à transportadora">
            <span>Copiar Relatório</span>
          </button>
        </div>
        <div id="tdModalReportText" style="font-size: 0.78rem; color: var(--text); line-height: 1.55; background: var(--surface-card); padding: 12px; border-radius: 10px; border: 1px solid var(--border-subtle);">
          Carregando relatório...
        </div>
      </div>

      <!-- CARD 2: FAIXAS TARIFÁRIAS CADASTRADAS -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h4 style="margin: 0; font-size: 0.76rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Faixas e Regras Cadastradas no Sistema</h4>
          <small id="tdModalFileUrl" style="font-size: 0.72rem; color: var(--muted); font-family: monospace;"></small>
        </div>

        <div style="border: 1px solid var(--line); border-radius: 12px; overflow: hidden; max-height: 280px; overflow-y: auto;">
          <table style="width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: left;">
            <thead style="background: var(--panel2); position: sticky; top: 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.7rem; text-transform: uppercase;">
              <tr>
                <th style="padding: 10px 12px;">UF / Região</th>
                <th style="padding: 10px 12px;">Faixa de Peso</th>
                <th style="padding: 10px 12px; text-align: right;">Preço Fixo</th>
                <th style="padding: 10px 12px; text-align: right;">Por kg Excedente</th>
                <th style="padding: 10px 12px; text-align: center;">Seguro %</th>
                <th style="padding: 10px 12px; text-align: center;">Prazo</th>
              </tr>
            </thead>
            <tbody id="tdModalRatesTbody">
              <tr>
                <td colspan="6" style="padding: 20px; text-align: center; color: var(--muted);">Carregando faixas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- RODAPÉ DO MODAL -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line);">
      <span style="font-size: 0.74rem; color: var(--muted);" id="tdModalCreatedAt">Importado em: -</span>
      <button type="button" onclick="closeTableDetailsModal()" class="btn sm secondary" style="padding: 8px 18px; font-size: 0.8rem;">
        <span>Fechar</span>
      </button>
    </div>

  </div>

</div>

<script>
let currentModalReportNotes = "";

async function openTableDetailsModal(tableId) {
  const m = document.getElementById("tableDetailsModal");
  if (!m) return;

  // Move para o body para garantir viewport fixed independente de scroll ou containers
  if (m.parentElement !== document.body) {
    document.body.appendChild(m);
  }

  // Resetar conteúdo
  document.getElementById("tdModalCarrierName").innerText = "Carregando...";
  document.getElementById("tdModalTableName").innerText = "";
  document.getElementById("tdModalRatesBadge").innerText = "...";
  document.getElementById("tdModalReportText").innerText = "Buscando relatório de auditoria...";
  document.getElementById("tdModalRatesTbody").innerHTML = `<tr><td colspan="6" style="padding: 20px; text-align: center; color: var(--muted);">Buscando regras da tabela...</td></tr>`;

  // Abrir no padrão canônico M-One
  m.style.removeProperty("display");
  m.style.display = "grid";
  m.style.zIndex = "99999";
  m.classList.add("show");

  try {
    const resp = await fetch(`/freight/tables/${tableId}/details`);
    const data = await resp.json();
    if (!data.success) {
      alert(data.message || "Erro ao carregar detalhes da tabela.");
      closeTableDetailsModal();
      return;
    }

    const t = data.table;
    document.getElementById("tdModalCarrierName").innerText = t.carrier_name;
    document.getElementById("tdModalTableName").innerText = `Tabela: ${t.table_name}`;
    document.getElementById("tdModalRatesBadge").innerText = `${data.total_rates} faixas cadastradas`;
    document.getElementById("tdModalCreatedAt").innerText = `Data de Importação: ${t.created_at_fmt || 'Recente'}`;
    document.getElementById("tdModalFileUrl").innerText = t.file_url ? `Arquivo: ${t.file_url}` : "";

    currentModalReportNotes = t.notes || "Tabela importada sem pendências registradas.";
    document.getElementById("tdModalReportText").innerText = currentModalReportNotes;

    // Renderizar tabela de faixas
    const tbody = document.getElementById("tdModalRatesTbody");
    if (!data.rates || data.rates.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding: 20px; text-align: center; color: var(--muted);">Nenhuma faixa cadastrada nesta tabela.</td></tr>`;
      return;
    }

    let rowsHtml = "";
    data.rates.forEach(r => {
      const ufText = r.uf ? `<strong style="color: var(--brand-blue);">${r.uf}</strong>` : 'Brasil';
      const cityText = r.city ? ` <span style="color: var(--muted); font-size: 0.72rem;">(${r.city})</span>` : '';
      const minW = parseFloat(r.min_weight) || 0;
      const maxW = parseFloat(r.max_weight) || 0;
      const weightRange = `${minW.toFixed(0)} a ${maxW >= 99999 ? '∞' : maxW.toFixed(0)} kg`;
      const fixP = parseFloat(r.fixed_price) || 0;
      const fixedPrice = fixP > 0 ? `R$ ${fixP.toFixed(2).replace('.', ',')}` : '-';
      const perKg = parseFloat(r.weight_price_per_kg) || 0;
      const perKgText = perKg > 0 ? `R$ ${perKg.toFixed(2).replace('.', ',')}` : '-';
      const adVal = ((parseFloat(r.ad_valorem_percent) || 0) + (parseFloat(r.gris_percent) || 0)).toFixed(2).replace('.', ',');
      const days = r.delivery_days ? `${r.delivery_days} dia(s)` : '-';

      rowsHtml += `
        <tr style="border-bottom: 1px solid var(--line);">
          <td style="padding: 8px 12px;">${ufText}${cityText}</td>
          <td style="padding: 8px 12px; font-family: monospace; font-size: 0.74rem;">${weightRange}</td>
          <td style="padding: 8px 12px; text-align: right; font-weight: 700; color: var(--accent);">${fixedPrice}</td>
          <td style="padding: 8px 12px; text-align: right; color: var(--text);">${perKgText}</td>
          <td style="padding: 8px 12px; text-align: center; color: var(--muted);">${adVal}%</td>
          <td style="padding: 8px 12px; text-align: center; font-weight: 700; color: var(--text);">${days}</td>
        </tr>
      `;
    });
    tbody.innerHTML = rowsHtml;
  } catch (err) {
    document.getElementById("tdModalReportText").innerText = `Erro ao buscar dados: ${err.message}`;
  }
}

function closeTableDetailsModal() {
  const m = document.getElementById("tableDetailsModal");
  if (m) {
    m.classList.remove("show");
    m.style.display = "none";
  }
}

function copyTableReportNotes() {
  if (!currentModalReportNotes) return;
  navigator.clipboard.writeText(currentModalReportNotes).then(() => {
    alert("Relatório copiado para a área de transferência! Você já pode colar e enviar para a transportadora.");
  }).catch(err => {
    alert("Erro ao copiar: " + err.message);
  });
}

window.openTableDetailsModal = openTableDetailsModal;
window.closeTableDetailsModal = closeTableDetailsModal;

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTableDetailsModal();
});
</script>
