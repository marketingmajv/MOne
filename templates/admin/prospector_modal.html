{#
  M-One Prospector Lead Modal (templates/admin/prospector_modal.html)
  Modal de Abordagem Comercial com Teleporte Nativo Alpine.js e Botão Fechar Geométrico.
  Anti-monólito modular (< 500 linhas).
#}
<template x-teleport="body">
  <div class="modal show" x-show="modalAberto" x-cloak style="display: flex;">
    <div class="modal-card modal-lg" @click.away="fecharModal()">
      <!-- Cabeçalho do Modal -->
      <div class="modal-head">
        <div class="head-info">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h3 class="modal-title" x-text="leadSelecionado?.nome || 'Ficha do Lead'"></h3>
            <span x-show="leadSelecionado?.status_contato === 'prospectado'" class="status-badge status-prospectado" style="font-size: 11px;">💬 Prospectado</span>
            <span x-show="leadSelecionado?.status_contato === 'novo' || !leadSelecionado?.status_contato" class="status-badge status-novo" style="font-size: 11px;">🟢 Disponível</span>
          </div>
          <span class="modal-subtitle" x-text="`${leadSelecionado?.cidade || ''} • Score: ${leadSelecionado?.score || 0}/100 (Classe ${leadSelecionado?.classificacao || 'D'})`"></span>
        </div>
        <button type="button" class="modal-close-btn" @click="fecharModal()" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body" x-show="leadSelecionado">
        <!-- Aviso se já foi prospectado por outro vendedor -->
        <div x-show="leadSelecionado?.prospectado_por_nome" class="alert-banner" style="background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); margin-bottom: 16px; padding: 10px 14px;">
          <div class="alert-banner-text" style="font-size: 12.5px;">
            <strong>⚠️ Atenção:</strong> Este lead já foi acionado por <strong x-text="leadSelecionado?.prospectado_por_nome"></strong>. Você ainda pode enviar uma nova mensagem de alinhamento se necessário.
          </div>
        </div>

        <!-- Se o vendedor não tem WhatsApp cadastrado no perfil -->
        <div x-show="!vendedorPhone" class="alert-banner" style="background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); margin-bottom: 16px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
          <div class="alert-banner-text" style="font-size: 12.5px; color: #fbbf24;">
            <strong>📱 WhatsApp Comercial Não Cadastrado:</strong> Cadastre seu número no seu perfil para assinar as mensagens de abordagem comercial aos clientes.
          </div>
          <button type="button" class="btn sm" onclick="openProfileModal()" style="background: rgba(0, 229, 153, 0.15); border: 1px solid var(--accent, #00E599); color: var(--accent, #00E599); font-weight: 700; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;">
            ⚙️ Cadastrar no Meu Perfil
          </button>
        </div>

        <!-- Se o vendedor tem WhatsApp cadastrado no perfil -->
        <div x-show="vendedorPhone" style="background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;">
          <div style="display: flex; align-items: center; gap: 6px; color: var(--muted);">
            <span>📱 Abordagem assinada com seu WhatsApp:</span>
            <strong style="color: var(--accent, #00E599); font-family: monospace;" x-text="vendedorPhone"></strong>
          </div>
          <button type="button" onclick="openProfileModal()" style="background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 11.5px; padding: 0;">
            Alterar no perfil
          </button>
        </div>

        <!-- DADOS CADASTRAIS & DECISOR -->
        <div class="lead-details-grid">
          <div class="detail-block">
            <span class="detail-label">Decisor / Sócio Administrador:</span>
            <strong class="detail-value highlight-cyan" x-text="leadSelecionado?.decisor_nome || 'Não identificado na Receita'"></strong>
            <small x-text="leadSelecionado?.decisor_cargo || ''"></small>
          </div>
          <div class="detail-block">
            <span class="detail-label">WhatsApp Comercial:</span>
            <div class="flex-align">
              <strong class="detail-value" x-text="leadSelecionado?.whatsapp || leadSelecionado?.telefone_google || 'Sem telefone'"></strong>
              <span x-show="leadSelecionado?.whatsapp" class="badge-status-wa">🟢 WhatsApp Verificado</span>
            </div>
          </div>
          <div class="detail-block">
            <span class="detail-label">CNPJ & Razão Social:</span>
            <strong class="detail-value" x-text="leadSelecionado?.cnpj || 'Pendente de validação'"></strong>
            <small x-text="leadSelecionado?.razao_social || ''"></small>
          </div>
          <div class="detail-block">
            <span class="detail-label">E-mail Comercial:</span>
            <div class="flex-align">
              <strong class="detail-value" x-text="leadSelecionado?.email || (leadSelecionado?.emails && leadSelecionado?.emails.length ? leadSelecionado.emails[0] : 'Não informado')"></strong>
              <a x-show="leadSelecionado?.email || (leadSelecionado?.emails && leadSelecionado?.emails.length)" :href="`mailto:${leadSelecionado?.email || leadSelecionado?.emails?.[0]}`" class="mail-action-btn">Enviar ✉️</a>
            </div>
          </div>
          <div class="detail-block">
            <span class="detail-label">Site & Redes Sociais:</span>
            <div class="flex-align" style="gap: 8px; flex-wrap: wrap; margin-top: 2px;">
              <a x-show="leadSelecionado?.site" :href="leadSelecionado?.site" target="_blank" class="contact-pill site" style="font-size: 11px;">🌐 Visitar Site</a>
              <a x-show="leadSelecionado?.instagram" :href="leadSelecionado?.instagram" target="_blank" class="contact-pill ig" style="font-size: 11px;">📸 Instagram</a>
              <span x-show="!leadSelecionado?.site && !leadSelecionado?.instagram" class="detail-value" style="font-size: 12px; color: var(--muted, #64748b);">Sem site/redes</span>
            </div>
          </div>
          <div class="detail-block">
            <span class="detail-label">Endereço Google Maps:</span>
            <span class="detail-value" x-text="leadSelecionado?.endereco || 'Endereço não disponível'"></span>
          </div>
        </div>

        <!-- RAIO-X RESUMO DA IA -->
        <div class="ia-section" style="margin-top: 14px;">
          <h4 class="section-title">🤖 Raio-X Operacional da Empresa (Gemini IA)</h4>
          <div class="ia-box" x-text="leadSelecionado?.resumo_ia || 'Resumo da empresa não disponível.'"></div>
        </div>

        <!-- MENSAGEM COMERCIAL EDITÁVEL (PROSPECTAR NO WHATSAPP) -->
        <div class="hook-section" style="margin-top: 16px;">
          <div class="hook-head">
            <h4 class="section-title" style="color: #15803d;">💬 Mensagem para Abordagem no WhatsApp (Editável)</h4>
            <div style="display: flex; gap: 8px;">
              <button type="button" class="btn sm" @click="restaurarGanchoPadrao()">↺ Restaurar Original</button>
              <button type="button" class="btn sm" @click="copiarTextoMensagem()">📋 Copiar</button>
            </div>
          </div>
          <textarea
            class="form-input form-textarea"
            x-model="mensagemEditavel"
            rows="6"
            style="width: 100%; font-family: monospace; font-size: 13px; line-height: 1.5; padding: 12px; border-radius: 10px; border: 1.5px solid rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.04); resize: vertical;"
            placeholder="Digite aqui o texto que será enviado ao lead no WhatsApp..."
          ></textarea>
          <small style="display: block; margin-top: 6px; color: var(--muted, #64748b); font-size: 11.5px;">
            💡 Você pode personalizar este texto antes de disparar. O botão abaixo abrirá a conversa já com o texto pronto no WhatsApp e registrará que você prospectou este lead.
          </small>
        </div>

        <!-- STATUS MANUAL OPCIONAL -->
        <div class="status-updater" style="margin-top: 16px;">
          <label style="font-size: 11.5px;">Atualizar Status Operacional Manualmente:</label>
          <div class="status-options">
            <button type="button" class="status-btn" :class="{ 'active': leadSelecionado?.status_contato === 'novo' }" @click="salvarStatus('novo')">Disponível</button>
            <button type="button" class="status-btn" :class="{ 'active': leadSelecionado?.status_contato === 'prospectado' }" @click="salvarStatus('prospectado')">Prospectado</button>
            <button type="button" class="status-btn" :class="{ 'active': leadSelecionado?.status_contato === 'em_negociacao' }" @click="salvarStatus('em_negociacao')">Em Negociação</button>
            <button type="button" class="status-btn" :class="{ 'active': leadSelecionado?.status_contato === 'convertido' }" @click="salvarStatus('convertido')">Convertido</button>
            <button type="button" class="status-btn" :class="{ 'active': leadSelecionado?.status_contato === 'descartado' }" @click="salvarStatus('descartado')">Descartado</button>
          </div>
        </div>
      </div>

      <!-- Rodapé com Botão Principal WhatsApp -->
      <div class="modal-footer" style="padding: 16px 20px; border-top: 1px solid var(--line, #e2e8f0); display: flex; justify-content: flex-end; gap: 12px; background: var(--panel2, #f8fafc); border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
        <button type="button" class="btn" @click="fecharModal()">Fechar</button>
        <button
          type="button"
          class="btn primary whatsapp-action-btn"
          style="background: #25D366; border-color: #25D366; color: #000; font-weight: 700; padding: 10px 20px; font-size: 13.5px;"
          :disabled="prospectandoLoading"
          @click="enviarWhatsAppEProspectar()"
        >
          <span x-show="!prospectandoLoading">🟢 Iniciar Conversa no WhatsApp</span>
          <span x-show="prospectandoLoading">Registrando e Abrindo WhatsApp...</span>
        </button>
      </div>
    </div>
  </div>
</template>
