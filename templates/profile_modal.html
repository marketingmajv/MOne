<!-- MODAL UNIFICADO: MEU PERFIL & SEGURANÇA -->
<div id="profileModal" class="modal" onclick="if(event.target === this) closeProfileModal()" style="z-index:9999;">
  <div class="modal-card" style="background:#0f172a;border:1px solid var(--line);border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);">
    
    <!-- Cabeçalho do Perfil -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:14px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg, #0284c7, #38bdf8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:#fff;">
          {{ me.name[:1]|upper if me and me.name else 'U' }}
        </div>
        <div>
          <h3 style="margin:0;font-size:1.15rem;color:#fff;">{{ me.name }}</h3>
          <small style="color:var(--text-muted);">@{{ me.username }} • <span style="color:#38bdf8;">{{ role_labels.get(me.role, me.role) }}</span></small>
        </div>
      </div>
      <button type="button" class="btn sm secondary" onclick="closeProfileModal()">✕</button>
    </div>

    <!-- SEÇÃO: SEGURANÇA & ALTERAÇÃO DE SENHA -->
    <div style="background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:10px;padding:18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span style="font-size:1.2rem;">🔒</span>
        <strong style="font-size:0.95rem;color:#fff;">Segurança & Acesso</strong>
      </div>
      <form method="post" action="{{ url_for('change_password') }}">
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:4px;">Nova Senha (mínimo 8 caracteres):</label>
          <input type="password" name="new_password" required minlength="8" placeholder="Digite sua nova senha" style="width:100%;padding:8px 12px;background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:6px;color:#fff;font-size:0.88rem;">
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button type="submit" class="btn sm secondary">Atualizar Senha</button>
        </div>
      </form>
    </div>

    <div style="margin-top:20px;text-align:right;">
      <button type="button" class="btn sm secondary" onclick="closeProfileModal()">Fechar</button>
    </div>

  </div>
</div>

<script>
function openProfileModal() {
  const m = document.getElementById('profileModal');
  if (m) {
    m.style.removeProperty('display');
    m.style.display = 'grid';
    m.classList.add('show');
  }
}

function closeProfileModal() {
  const m = document.getElementById('profileModal');
  if (m) {
    m.classList.remove('show');
    m.style.display = 'none';
  }
}
</script>
