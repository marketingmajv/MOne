<!-- MODAL EXECUTIVO SOBREPOSTO: RESULTADOS DE FRETE (templates/modal_freight_results.html) -->
<div id="freightResultsModal" class="modal" onclick="if(event.target === this) closeFreightModal()" style="z-index: 9999; display: none;">
  
  <div class="modal-card" style="background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 18px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
    
    <!-- CABEÇALHO DO MODAL -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(0, 229, 153, 0.12); color: var(--accent); border: 1px solid rgba(0, 229, 153, 0.25); display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">
          🚚
        </span>
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <h3 style="margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--text);">Opções Disponíveis de Frete</h3>
            <span id="modalQuoteNumberBadge" class="badge" style="font-size: 0.68rem; font-weight: 700; background: rgba(0, 229, 153, 0.12); color: var(--accent); border-color: rgba(0, 229, 153, 0.25);">COTADO</span>
          </div>
          <p id="modalDestSubtitle" style="margin: 2px 0 0; font-size: 0.76rem; color: var(--muted);">
            Destino e cotações comparadas por menor custo
          </p>
        </div>
      </div>
      
      <button type="button" onclick="closeFreightModal()" style="background: var(--surface-subtle); border: 1px solid var(--border-subtle); color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; font-weight: bold; transition: all 0.15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'" title="Fechar (Esc)">✕</button>
    </div>

    <!-- CORPO COM SCROLL: RESUMO DA CARGA + RANKING -->
    <div style="display: flex; flex-direction: column; gap: 16px;">
      
      <!-- BENTO RESUMO DA CARGA -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-subtle); border: 1px solid var(--border-subtle); font-size: 0.78rem;">
        <div>
          <span style="font-size: 0.68rem; color: var(--muted); display: block; font-weight: 700; text-transform: uppercase;">Carga & Volumes</span>
          <strong id="modalCargoSummary" style="color: var(--text); font-weight: 700; font-size: 0.8rem; display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</strong>
        </div>
        <div>
          <span style="font-size: 0.68rem; color: var(--muted); display: block; font-weight: 700; text-transform: uppercase;">Peso Físico Total</span>
          <strong id="modalWeightSummary" style="color: var(--text); font-weight: 700; font-size: 0.8rem; display: block; margin-top: 2px;">-</strong>
        </div>
        <div>
          <span style="font-size: 0.68rem; color: var(--muted); display: block; font-weight: 700; text-transform: uppercase;">Base Seguro (1/3)</span>
          <strong id="modalInsuranceSummary" style="color: var(--accent); font-weight: 700; font-size: 0.8rem; display: block; margin-top: 2px;">-</strong>
        </div>
      </div>

      <!-- LISTA COMPARATIVA DAS TRANSPORTADORAS -->
      <div id="modalCarrierRankingList">
        <!-- Renderizado dinamicamente via static/js/freight.js -->
      </div>

    </div>

    <!-- RODAPÉ DE AÇÕES -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line);">
      <button type="button" onclick="closeFreightModal()" class="btn sm secondary" style="padding: 8px 18px; font-size: 0.8rem;">
        <span>Fechar / Ajustar</span>
      </button>

      <div style="display: flex; align-items: center; gap: 8px;">
        <button type="button" onclick="copyWhatsAppMessage()" class="btn sm secondary" style="font-size: 0.78rem; padding: 6px 14px; gap: 6px;" title="Copiar resumo para WhatsApp">
          <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>WhatsApp</span>
        </button>
        <button type="button" onclick="exportFreightPDF()" class="btn sm primary" style="font-size: 0.78rem; padding: 6px 14px; gap: 6px;" title="Exportar PDF consolidado">
          <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span>Gerar PDF</span>
        </button>
      </div>
    </div>

  </div>

</div>
