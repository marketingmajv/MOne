<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Não Encontrado | M-One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0a0d14;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #121722;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 460px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 12px;
      font-weight: 800;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .slug-badge {
      display: inline-block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #e5a93b;
      color: #0f172a;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔍</div>
    <h1>Catálogo não encontrado</h1>
    <div class="slug-badge">/c/{{ slug }}</div>
    <p>O link acessado não corresponde a nenhum catálogo ativo no momento. Verifique o endereço digitado ou solicite um novo link ao consultor.</p>
    <a href="https://wa.me/5527996051538?text=Ol%C3%A1!%20Acessei%20o%20link%20/c/{{ slug }}%20mas%20o%20cat%C3%A1logo%20n%C3%A3o%20foi%20encontrado." class="btn">Falar com Suporte no WhatsApp</a>
  </div>
</body>
</html>
