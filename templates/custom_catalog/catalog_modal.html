{#
  M-One Custom Catalog Product Modal (templates/custom_catalog/catalog_modal.html)
  Modal Interativo de Ficha Técnica, Galeria de Fotos e Especificações para Catálogos Personalizados.
  Segregação modular estrita (< 500 linhas).
#}
<template x-teleport="body">
  <div class="outlet-modal-backdrop" 
       x-show="modalOpen" 
       x-cloak 
       @click.self="closeModal()"
       @keydown.escape.window="closeModal()">
    
    <div class="outlet-modal-box">
      <!-- Botão Fechar com SVG Geométrico (UX Audit Compliant) -->
      <button type="button" class="modal-close-btn" @click="closeModal()" aria-label="Fechar Modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-scroll-body">
        <template x-if="selectedItem">
          <div class="modal-content-grid">
            <!-- Coluna Visual / Galeria de Fotos -->
            <div class="modal-gallery-col">
              <div class="modal-main-image">
                <img :src="activeImage || selectedItem.image_main || selectedItem.image_url || selectedItem.photo_url || '/static/logo.png'" 
                     :alt="selectedItem.name" 
                     decoding="async">
              </div>
              
              <!-- Régua de Miniaturas Interativa -->
              <div class="modal-thumbs" x-show="getItemGallery(selectedItem).length > 1">
                <template x-for="(img, idx) in getItemGallery(selectedItem)" :key="idx">
                  <div class="thumb-item" 
                       :class="{'active': activeImage === img}"
                       @click="activeImage = img">
                    <img :src="img" alt="Foto miniatura" decoding="async" loading="lazy">
                  </div>
                </template>
              </div>
            </div>

            <!-- Coluna Detalhes e Ações -->
            <div class="modal-info-col">
              <div class="modal-header-tag">
                <span class="modal-category" x-text="selectedItem.category || 'Veículo Elétrico'"></span>
                {% if catalog.source_matrix == 'atacado' %}
                <span class="badge-cnpj">VENDA EXCLUSIVA CNPJ</span>
                {% else %}
                <span class="partner-brand-badge">⚡ Pronta Entrega</span>
                {% endif %}
              </div>
              <h2 class="modal-title" x-text="selectedItem.name"></h2>
              
              <!-- Box de Preço Personalizado -->
              <div class="modal-pricing-box">
                <template x-if="selectedItem.show_price && selectedItem.computed_price > 0">
                  <div>
                    <div class="price-to">
                      <span class="currency">R$</span>
                      <span class="amount" x-text="formatPrice(selectedItem.computed_price)"></span>
                      <span class="payment-method">{% if catalog.source_matrix == 'atacado' %}à vista CNPJ (PIX / Transferência){% else %}à vista{% endif %}</span>
                    </div>
                    <template x-if="selectedItem.computed_installment_12 > 0">
                      <div class="price-installments" style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">
                        ou em até 12x de <strong style="color: #f8fafc;" x-text="'R$ ' + formatPrice(selectedItem.computed_installment_12)"></strong>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="!selectedItem.show_price || selectedItem.computed_price <= 0">
                  <div class="price-to">
                    <span class="amount" style="font-size: 1.35rem; color: #e5a93b; font-weight: 800;">Sob Consulta</span>
                    <span class="payment-method">Consulte valores e condições exclusivas no WhatsApp</span>
                  </div>
                </template>

                <div class="modal-stock-badge" 
                     :class="selectedItem.stock_qty > 0 ? 'badge-pronta-entrega' : 'badge-sob-encomenda'" 
                     x-text="selectedItem.stock_qty > 0 ? '⚡ Disponibilidade: Pronta Entrega' : '📦 Disponibilidade: Sob Encomenda'">
                </div>
              </div>

              <!-- Descrição -->
              <p class="modal-desc" x-show="selectedItem.description" x-text="selectedItem.description"></p>

              <!-- Tabela de Ficha Técnica / Especificações -->
              <div class="modal-specs-section">
                <h3>Ficha Técnica & Especificações</h3>
                <div class="specs-table">
                  <template x-for="(val, key) in selectedItem.specs_json" :key="key">
                    <div class="spec-row" x-show="key !== 'stock_breakdown' && key !== 'color_prices' && !key.toLowerCase().includes('preço') && !key.toLowerCase().includes('preco')">
                      <span class="spec-k" x-text="key"></span>
                      <span class="spec-v" x-text="val"></span>
                    </div>
                  </template>
                  <div class="spec-row" x-show="selectedItem.color">
                    <span class="spec-k">Cor</span>
                    <span class="spec-v" x-text="selectedItem.color"></span>
                  </div>
                  <div class="spec-row" x-show="selectedItem.power || selectedItem.motor">
                    <span class="spec-k">Potência</span>
                    <span class="spec-v" x-text="selectedItem.power || selectedItem.motor"></span>
                  </div>
                  <div class="spec-row" x-show="selectedItem.battery">
                    <span class="spec-k">Bateria</span>
                    <span class="spec-v" x-text="selectedItem.battery"></span>
                  </div>
                  <div class="spec-row" x-show="selectedItem.autonomy || selectedItem.range">
                    <span class="spec-k">Autonomia</span>
                    <span class="spec-v" x-text="selectedItem.autonomy || selectedItem.range"></span>
                  </div>
                  <div class="spec-row" x-show="selectedItem.speed">
                    <span class="spec-k">Velocidade Máxima</span>
                    <span class="spec-v" x-text="selectedItem.speed"></span>
                  </div>
                </div>
              </div>

              <!-- Botão WhatsApp CTA -->
              <div class="modal-cta-box" style="margin-top: 20px;">
                <a :href="selectedItem.whatsapp_cta_url" 
                   target="_blank" 
                   @click="trackWhatsAppClick()" 
                   class="btn-modal-whatsapp btn-wa-action"
                   style="font-size: 1rem; padding: 14px 20px; border-radius: 10px;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                  <span x-text="(selectedItem.show_price && selectedItem.computed_price > 0) ? 'Garantir Este Modelo no WhatsApp' : 'Consultar Preço no WhatsApp'"></span>
                </a>
                <span class="modal-secure-note" style="display: block; text-align: center; margin-top: 8px; font-size: 0.75rem; color: #64748b;">
                  🔒 Atendimento direto via WhatsApp • Garantia e suporte oficial
                </span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
